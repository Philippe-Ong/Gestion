# Compile l'APK Android signé et l'attache à une release GitHub à chaque tag vX.Y[.Z].
# Secrets requis (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            echo "::error::Tag '$TAG' invalide, format attendu vX.Y ou vX.Y.Z"
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[4]:-0}
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer et synchroniser Capacitor
        run: |
          npm install
          npm run sync

      - name: Préparer la signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!s}" ]; then
              echo "::error::Secret ANDROID_$s manquant ou vide"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > android/release.keystore 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 n'est pas du base64 valide (${#KEYSTORE_BASE64} caractères)"
            exit 1
          fi
          echo "::notice::Keystore décodé, SHA-256 $(sha256sum android/release.keystore | cut -d' ' -f1)"
          if ! keytool -list -keystore android/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/keytool.log 2>&1; then
            echo "::error::Keystore invalide : $(grep -m1 -iE 'exception|error|erreur|does not exist|incorrect' /tmp/keytool.log)"
            exit 1
          fi
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compiler l'APK release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk "../TheCol-Gestion-${GITHUB_REF_NAME}.apk"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: TheCol-Gestion-${{ github.ref_name }}.apk
          generate_release_notes: true
